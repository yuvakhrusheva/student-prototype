<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерфейс ученика · AI Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  @font-face{font-family:"Inter";src:url("Inter.ttf") format("truetype-variations"),url("Inter.ttf") format("truetype");font-weight:100 900;font-style:normal;font-display:swap}
  /* Токены по Figma «AI Math AZ · Student flow» — см. DESIGN_SYSTEM.md */
  :root{
    --bg:#F7F5FF; --surface:#FFFFFF; --surface-2:#F7F5FF;
    --ink:#101828; --muted:rgba(16,24,40,.45); --line:#E1DBFF;
    --accent:#704DFF; --accent-soft:#EBE5FF;
    --violet-muted:#9083C3;
    --green:#66AA22; --green-soft:#D9FBB6; --green-border:#B0DF81;
    --blue:#3B82F6; --blue-soft:#E7EEFE;
    --amber:#E0A012; --amber-soft:#FBF0D5;
    --coral:#F25A7D; --coral-soft:#FEDBE3; --coral-border:#FDA6BA;
    --gray:#B0AAB6; --gray-soft:#F1EFF8;
    --lime:#B0DF81; --yellow:#F8E107;
    --shadow:0 6px 24px rgba(16,20,40,.05),0 1px 3px rgba(16,20,40,.04);
    --radius:12px;
    --font-kid:"M PLUS Rounded 1c","Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ===== Review shell (same chrome as teacher prototype) ===== */
  body{overflow:hidden}
  .app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:64px 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}
  .logo .mark svg{width:30px;height:34px;display:block}
  .hdr-ctx{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  .hdr-ctx .chip{background:var(--surface-2);border:1px solid var(--line);padding:5px 12px;border-radius:999px;color:var(--ink);font-weight:600}
  .hdr-ctx .lesson{color:var(--ink);font-weight:600}
  .hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}

  aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto}
  .nav-group{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 14px 5px}
  .nav-group:first-child{padding-top:2px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:12px;color:var(--muted);font-weight:600;width:100%;text-align:left;font-size:13px}
  .nav-item .ic{font-size:15px;width:18px;text-align:center}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item.on{background:var(--accent-soft);color:var(--accent)}
  .nav-item.disabled{opacity:.45;cursor:not-allowed}
  .nav-item.disabled:hover{background:none}
  .nav-soon{margin-left:auto;font-size:10px;background:var(--gray-soft);color:var(--muted);padding:2px 7px;border-radius:999px;font-weight:700}
  .nav-spacer{flex:1}
  .nav-foot{padding:12px 14px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}

  main{padding:14px 26px 16px;overflow:hidden;display:flex;flex-direction:column;align-items:center}

  /* Demo bar above the device */
  .demo-bar{width:100%;max-width:1140px;display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:36px;flex-shrink:0}
  .demo-bar .lbl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .demo-btn{background:var(--surface);border:1.5px dashed var(--accent);color:var(--accent);font-weight:700;font-size:12.5px;padding:7px 14px;border-radius:999px;transition:.12s}
  .demo-btn:hover{background:var(--accent-soft)}
  .demo-btn.ghost{border-color:var(--line);color:var(--muted)}
  .demo-note{font-size:12px;color:var(--muted)}

  /* ===== Device frames ===== */
  .stage{display:flex;justify-content:center;align-items:flex-start;width:100%;flex:1;min-height:0;overflow:hidden}
  .devwrap{transform-origin:top center}
  .tablet{width:1100px;max-width:100%;background:#1B1B1F;border-radius:26px;padding:16px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
  .tablet .cam{width:7px;height:7px;border-radius:50%;background:#3a3a42;margin:0 auto 10px}
  .tscreen{background:var(--bg);border-radius:14px;height:680px;overflow:hidden;position:relative;font-family:var(--font-kid)}
  .phone{width:400px;max-width:100%;background:#1B1B1F;border-radius:38px;padding:12px;box-shadow:0 20px 50px rgba(16,24,40,.25)}
  .phone .notch{width:110px;height:22px;background:#1B1B1F;border-radius:0 0 14px 14px;position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:5}
  .phone{position:relative}
  .pscreen{background:var(--bg);border-radius:28px;height:780px;overflow:hidden;position:relative;font-family:var(--font-kid)}

  .dscreen{display:none;min-height:100%}
  .dscreen.on{display:block}

  /* ===== Student UI (kid-friendly: large, round, warm) ===== */
  .t-pad{padding:26px 34px}
  .p-pad{padding:34px 20px 24px}

  .t-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .t-top .who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
  .kid-ava{width:40px;height:40px;border-radius:50%;background:#FFB020;display:grid;place-items:center;font-size:20px}
  .t-top .ctx{color:var(--muted);font-size:13px;font-weight:600}
  .t-top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .pill{padding:6px 14px;border-radius:999px;font-weight:700;font-size:12.5px;background:var(--bg);border:1px solid var(--line)}
  .pill.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .pill.green{background:var(--green-soft);color:var(--green);border-color:var(--green-border)}
  .pill.amber{background:var(--amber-soft);color:#B9871F;border-color:transparent}

  .bigcard{background:var(--surface);border:none;border-radius:20px;box-shadow:var(--shadow);padding:28px 32px}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}

  h1.kid{font-size:32px;font-weight:700;letter-spacing:-.02em}
  h2.kid{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:15px;font-weight:500}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:12px;transition:.12s;text-align:center}
  .btn.primary{background:var(--accent);color:#fff;font-size:17px;padding:15px 30px}
  .btn.primary:hover{background:#5B3BE6}
  .btn.primary:disabled{opacity:.45;cursor:not-allowed}
  .btn.soft{background:var(--accent-soft);color:var(--accent);font-size:15px;padding:12px 22px}
  .btn.soft:hover{background:#E1D8FF}
  .btn.ghost{background:var(--surface);border:1.5px solid var(--line);color:var(--accent);font-size:15px;padding:11px 20px}
  .btn.big{font-size:19px;padding:17px 38px;border-radius:12px}

  /* waiting screen */
  .wait-wrap{height:100%;display:flex;flex-direction:column}
  .wait-hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
  .wait-doodle{font-size:64px}
  .pulse{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 22px;font-weight:700;color:var(--muted)}
  .pulse .dot{width:10px;height:10px;border-radius:50%;background:var(--amber);animation:pl 1.2s infinite}
  @keyframes pl{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}

  /* phase header inside lesson */
  .phasebar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .phasebar .ph{flex:1;height:8px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
  .phasebar .ph.done{background:#B7A6F7}
  .phasebar .ph.cur{background:var(--accent)}
  .phasebar .nm{font-weight:800;font-size:14px}
  .phasebar .tag{font-size:11.5px;font-weight:700;color:var(--muted)}

  /* warm-up */
  .q-progress{display:flex;gap:8px;justify-content:center;margin-bottom:14px;counter-reset:qd}
  .q-dot{width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);counter-increment:qd;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--accent)}
  .q-dot::after{content:counter(qd)}
  .q-dot.cur{background:var(--accent);border-color:var(--accent);color:#fff}
  .q-dot.ok{background:#B7A6F7;border-color:#B7A6F7;color:#fff}
  .q-dot.bad{background:var(--coral-soft);border-color:var(--coral-border);color:var(--coral)}
  .q-dot.bad::after{content:"✕";font-size:11px}
  .question{font-size:28px;font-weight:700;text-align:center;margin:18px 0 26px;letter-spacing:-.02em;line-height:1.25}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px;margin:0 auto}
  .opt{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px 20px;font-size:20px;font-weight:700;transition:.12s;text-align:center;box-shadow:0 2px 6px rgba(16,20,40,.03)}
  .opt:hover{border-color:var(--accent);transform:translateY(-2px)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .opt.sel-ok{border-width:3px;border-color:var(--green-border);background:var(--green-soft);color:var(--ink)}
  .opt.sel-bad{border-width:3px;border-color:var(--coral-border);background:var(--coral-soft);color:var(--ink)}
  .opt.show-ok{border-width:3px;border-color:var(--green-border)}
  .opt:disabled{cursor:default;transform:none}
  .feedback{text-align:center;margin-top:20px;min-height:64px}
  .feedback .fb{display:inline-flex;align-items:center;gap:10px;border-radius:14px;padding:12px 22px;font-weight:700;font-size:17px}
  .fb.ok{background:var(--green-soft);color:var(--green)}
  .fb.bad{background:var(--coral-soft);color:var(--coral)}

  /* explanation */
  .slide{background:var(--surface);border:none;border-radius:20px;box-shadow:var(--shadow);height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:30px}
  .slide .big{font-size:44px;font-weight:700;letter-spacing:-.02em}
  .slide .formula{font-size:30px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:14px 28px;border-radius:16px}
  .dots-vis{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:620px}
  .dgroup{display:grid;grid-template-columns:repeat(5,18px);gap:6px;padding:12px;border-radius:14px;background:var(--blue-soft)}
  .dgroup.rest{background:var(--amber-soft)}
  .dgroup i{width:14px;height:14px;border-radius:50%;background:var(--blue)}
  .dgroup.rest i{background:var(--amber)}
  .viewonly{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;color:var(--muted);font-weight:700;font-size:13.5px}
  .viewonly .lock{background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;display:inline-flex;gap:8px;align-items:center;font-size:12.5px}
  .slidecount{position:absolute;right:34px;bottom:24px;font-size:13px;color:var(--muted);font-weight:700}

  /* practice */
  .prac-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .prac-prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700;color:var(--muted);font-size:13px}
  .task-card{background:var(--surface);border:none;border-radius:20px;box-shadow:var(--shadow);padding:30px 36px;max-width:760px;margin:0 auto}
  .task-num{font-size:13px;font-weight:700;color:var(--violet-muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:10px}
  .task-text{font-size:22px;font-weight:700;line-height:1.4}
  .answer-row{display:flex;gap:16px;align-items:flex-end;margin-top:24px;flex-wrap:wrap}
  .ans-field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
  .ans-field input{width:120px;font-family:inherit;font-size:24px;font-weight:700;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;outline:none;background:#FBFAFF;color:var(--accent)}
  .ans-field input:focus{border-color:var(--accent);background:var(--accent-soft)}
  .ans-field input.ok{border-color:var(--green-border);background:var(--green-soft);color:var(--ink)}
  .ans-field input.bad{border-color:var(--coral-border);background:var(--coral-soft);color:var(--ink)}
  .task-foot{display:flex;align-items:center;gap:12px;margin-top:22px}
  .help-link{margin-left:auto}
  .written-banner{display:flex;gap:14px;align-items:center;background:var(--amber-soft);border-radius:16px;padding:16px 20px;margin-top:20px;font-weight:600}
  .written-banner .ic{font-size:26px}

  /* camera */
  .cam-stage{background:#16162E;border-radius:20px;height:440px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cam-frame{position:absolute;inset:36px;border-radius:14px}
  .cam-frame i{position:absolute;width:46px;height:46px;border:4px solid #8F78FF}
  .cam-frame i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none;border-radius:12px 0 0 0}
  .cam-frame i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none;border-radius:0 12px 0 0}
  .cam-frame i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 12px}
  .cam-frame i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 12px 0}
  .cam-hint{color:#fff;font-weight:700;font-size:16px;background:rgba(0,0,0,.45);padding:10px 22px;border-radius:999px}
  .notebook{width:62%;height:78%;background:repeating-linear-gradient(#fff,#fff 26px,#dbe4f0 27px);border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);position:relative;transform:rotate(-1.5deg)}
  .notebook::before{content:"26 : 6 = 4 (ост. 2)\A 6 × 4 = 24\A 26 − 24 = 2";white-space:pre;position:absolute;top:22px;left:26px;font-family:"Comic Sans MS","Segoe Print",cursive;font-size:19px;color:#2c4a8a;line-height:27px}
  .cam-actions{display:flex;gap:14px;justify-content:center;margin-top:20px}
  .shutter{width:64px;height:64px;border-radius:50%;background:var(--accent);border:none;transition:.12s;color:#fff;font-size:24px;display:grid;place-items:center}
  .shutter::after{content:"📷";filter:grayscale(1) brightness(3)}
  .shutter:hover{transform:scale(1.06);background:#5B3BE6}
  /* photo versions history (несколько фото на одно задание) */
  .photo-hist{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px;margin:6px auto 2px}
  .ph-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px}
  .ph-thumb{width:34px;height:34px;border-radius:8px;background:var(--surface-2,#f2eefb);display:grid;place-items:center;font-size:17px;flex-shrink:0}
  .ph-meta{font-weight:700;font-size:13.5px}

  /* stuck */
  .stuck-card{max-width:560px;margin:40px auto 0}
  .stuck-emoji{font-size:54px;margin-bottom:8px}
  .queue-pos{background:var(--green-soft);border:1px solid var(--green-border);color:var(--green);font-weight:700;border-radius:999px;padding:9px 18px;font-size:15px}
  .queue-pos b{color:#4E8317}
  .defer-hint{display:inline-flex;align-items:center;gap:6px;margin-left:auto;font-size:12.5px;color:#C2392E;font-weight:700}
  .defer-pill{background:#FDECEA;border:1px solid #F3B6AE;color:#C2392E;font-weight:700;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
  .defer-pill:hover{background:#fbd9d3}

  /* reflection */
  .emoji-row{display:flex;gap:16px;justify-content:center;margin:26px 0 8px;flex-wrap:wrap}
  .emo{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px;width:150px;transition:.12s;display:flex;flex-direction:column;align-items:center;gap:10px}
  .emo .e{font-size:44px}
  .emo .l{font-weight:700;font-size:15px;color:var(--accent)}
  .emo:hover{border-color:var(--accent);transform:translateY(-3px)}
  .emo.sel{border:2px solid var(--accent);background:var(--bg)}
  .emo.sel .l{color:var(--accent)}

  /* finish */
  .finish-stats{display:flex;gap:14px;justify-content:center;margin:20px 0;flex-wrap:wrap}
  .fstat{background:var(--surface);border:none;box-shadow:var(--shadow);border-radius:16px;padding:18px 26px;min-width:150px;text-align:center}
  .fstat .v{font-size:32px;font-weight:700;color:var(--accent)}
  .fstat .v.green{color:var(--accent)} .fstat .v.accent{color:var(--accent)}
  .fstat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .hw-card{display:flex;align-items:center;gap:16px;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:18px 24px;max-width:560px;margin:18px auto 0;text-align:left}
  .hw-card .ic{font-size:34px}
  .hw-card b{font-size:15.5px}
  .hw-card .meta{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px}

  /* ===== Phone UI ===== */
  .p-greet{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .p-greet h2{font-size:20px;font-weight:800}
  .p-greet .sub{font-size:12.5px}
  .pcard{background:var(--surface);border:none;border-radius:18px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
  .pcard .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .pcard .hd .t{font-weight:800;font-size:15px}
  .deadline{margin-left:auto;font-size:11.5px;font-weight:700;color:#B9871F;background:var(--amber-soft);padding:4px 10px;border-radius:999px}
  .pbar{height:10px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin:10px 0 6px}
  .pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:.3s}
  .pbar.green i{background:var(--green-border)}
  .pmeta{font-size:12px;color:var(--muted);font-weight:600}
  .prow{display:flex;gap:10px}
  .prow .pcard{flex:1;text-align:center;margin-bottom:0}
  .prow .v{font-size:22px;font-weight:800}
  .prow .l{font-size:11px;color:var(--muted);font-weight:600}
  .p-q{font-size:24px;font-weight:800;text-align:center;margin:16px 0}
  .p-opts{display:grid;gap:10px}
  .p-opt{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-weight:700;text-align:center;transition:.12s}
  .p-opt:hover{border-color:var(--accent)}
  .p-opt.sel-ok{border-color:var(--green-border);background:var(--green-soft);color:var(--ink)}
  .p-opt.sel-bad{border-color:var(--coral-border);background:var(--coral-soft);color:var(--ink)}
  .p-opt.show-ok{border-color:var(--green-border)}
  .fb-topic{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:4px}
  .fb-line{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;margin-top:9px}
  .fb-line .ic{font-size:15px;flex-shrink:0;line-height:1.4}
  .fb-line.grow{background:var(--amber-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
  .hw-dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
  .hw-dot{width:22px;height:7px;border-radius:99px;background:var(--line)}
  .hw-dot.cur{background:var(--accent)} .hw-dot.ok{background:#B7A6F7} .hw-dot.bad{background:var(--coral-border)}
  .review-item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-size:13.5px}
  .review-item .ic{font-size:18px}
  .review-item .ok-ans{color:var(--green);font-weight:700}

  /* progress trail */
  .trail{position:relative;padding:6px 0 6px 26px}
  .trail::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:4px;border-radius:99px;background:var(--line)}
  .tnode{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;margin-bottom:10px}
  .tnode::before{content:"";position:absolute;left:-23px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:var(--green);border:3px solid var(--bg)}
  .tnode.cur{border-color:var(--accent);background:var(--accent-soft)}
  .tnode.cur::before{background:var(--accent);animation:pl 1.4s infinite}
  .tnode.locked{opacity:.55}
  .tnode.locked::before{background:var(--gray)}
  .tnode.missed{border-color:var(--amber)}
  .tnode.missed::before{background:var(--amber)}
  .tnode.missed .st{color:#B9871F}
  .tnode .dim-ic{opacity:.5;font-size:15px}
  .tnode .nm{font-weight:800;font-size:14px}
  .tnode .st{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .tnode .stars{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:15px;letter-spacing:1px}
  .hwlist-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
  .hwlist-item:first-of-type{border-top:none}
  .hwlist-item .nm{font-weight:700;font-size:13.5px}
  .hwlist-item .why{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
  .hwlist-item .right{margin-left:auto}
  .hwlist-item .btn{padding:8px 14px;font-size:12.5px}
  .hw-stars{font-size:16px;letter-spacing:1px;color:#F5B301;white-space:nowrap}
  .hw-stars .dim{color:var(--line)}
  .big-stars{font-size:42px;letter-spacing:5px;color:#F5B301;margin:2px 0}
  .big-stars .dim{color:var(--line)}

  /* ===== Lesson review (read-only «режим просмотра») ===== */
  .tnode.rev-link{cursor:pointer;transition:.12s}
  .tnode.rev-link:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(16,24,40,.07)}
  .rev-wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;max-width:980px;margin:0 auto;width:100%}
  .rev-sec{margin-top:14px}
  .rev-sec:first-child{margin-top:0}
  .rev-sec-h{font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--violet-muted);text-transform:uppercase;margin-bottom:7px}
  .rev-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
  .rev-row:first-child{border-top:none}
  .rev-row .ic{font-size:16px;flex-shrink:0;line-height:1.45;font-weight:800}
  .rev-d{flex:1;min-width:0}
  .rev-q{font-weight:700;font-size:14.5px}
  .rev-a{font-size:13px;color:var(--muted);margin-top:2px}
  .ok-ans{color:var(--green);font-weight:700}
  .bad-ans{color:var(--coral);font-weight:700}

  /* stub screens */
  .stub{max-width:620px;margin:50px auto;text-align:center}
  .stub .e{font-size:60px;margin-bottom:12px}
  .stub p{color:var(--muted);margin-top:10px;font-size:14.5px;line-height:1.6}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;font-weight:700;padding:12px 24px;border-radius:999px;transition:.25s;z-index:99;opacity:0}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}

  /* warm-up / explanation: class answer distribution on student tablet */
  .wdist{margin-top:18px;display:flex;flex-direction:column;gap:8px;max-width:560px;margin-left:auto;margin-right:auto;width:100%}
  .wdist-cap{font-size:14px;font-weight:700;color:var(--violet-muted);text-transform:uppercase;letter-spacing:.04em;text-align:left}
  .wdist-main{display:flex;align-items:center;gap:14px}
  .wdist-track{flex:1;height:20px;background:#EEEDF3;border-radius:999px;overflow:hidden}
  .wdist-track i{display:block;height:100%;background:var(--green-border);border-radius:999px}
  .wdist-pct{font-weight:700;font-size:20px;color:var(--green)}
  .wdist-counts{font-size:16px;font-weight:500;color:var(--muted);text-align:left}
  .wdist-counts b{font-weight:700;color:var(--ink)}
  .wdist-counts .okn{color:var(--green)}
  .wdist-counts .gap{display:inline-block;width:26px}

  /* unified student home: two work-blocks (lesson + homework) */
  .home-stack{display:flex;flex-direction:column;gap:20px;max-width:760px;margin:0 auto;width:100%}
  .hb-label{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--violet-muted);margin-bottom:9px;text-align:left}
  .home-card{display:flex;align-items:center;gap:15px;width:100%;background:var(--surface);border:none;box-shadow:var(--shadow);border-radius:18px;padding:18px 22px;cursor:pointer;text-align:left;transition:.12s;font-family:inherit;color:inherit}
  .home-card:hover{border-color:var(--accent);box-shadow:0 6px 18px rgba(16,24,40,.08)}
  .home-card .hc-ic{font-size:30px;flex-shrink:0}
  .home-card .hc-d{flex:1}
  .home-card .hc-d b{font-size:17px}
  .home-card .hc-d .meta{color:var(--muted);font-size:13.5px;margin-top:3px}
  .home-card .hc-go{font-size:24px;color:var(--accent);font-weight:700;flex-shrink:0}
  .lesson-status{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .lesson-status .ls-meta{color:var(--muted);font-size:11.5px;margin-top:4px}

  /* clickable homework card on the «Урок пройден» screen */
  .hw-card.link{cursor:pointer;width:100%;font-family:inherit;color:inherit;border:none;transition:.12s}
  .hw-card.link:hover{box-shadow:0 6px 18px rgba(112,77,255,.18)}
  .hw-card .go{margin-left:auto;font-size:26px;color:var(--accent);font-weight:700;flex-shrink:0}

  /* ===== Reflection · criteria self-assessment (3-level) ===== */
  .crit-list{display:flex;flex-direction:column;gap:14px;max-width:700px;margin:20px auto 0;width:100%}
  .crit-item{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left}
  .crit-q{font-weight:800;font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .crit-q .n{flex:0 0 26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px}
  .crit-opts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .crit-opt{border:2px solid var(--line);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-weight:700;font-size:12.5px;color:var(--muted);transition:.12s;text-align:center;line-height:1.25}
  .crit-opt .ce{font-size:28px}
  .crit-opt:hover{border-color:var(--accent)}
  .crit-opt.sel.l0{border-color:var(--coral);background:var(--coral-soft);color:var(--coral)}
  .crit-opt.sel.l1{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .crit-opt.sel.l2{border-color:var(--green);background:var(--green-soft);color:var(--green)}

  /* ===== МСО (контрольная работа) ===== */
  .mso-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .mso-count{font-weight:700;color:var(--muted);font-size:13px}
  .mso-timer{display:inline-flex;align-items:center;gap:8px;background:var(--amber-soft);color:#B9871F;border-radius:999px;padding:7px 16px;font-weight:800;font-size:14px}
  .mso-timer .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);animation:pl 1.2s infinite}
  .tq-row{display:flex;gap:9px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
  .tq{width:46px;height:46px;border-radius:13px;border:2.5px solid var(--line);background:var(--surface);font-weight:800;font-size:16px;color:var(--muted);transition:.12s;position:relative}
  .tq:hover{border-color:var(--accent)}
  .tq.ans{background:var(--accent);border-color:var(--accent);color:#fff}
  .tq.cur{box-shadow:0 0 0 3.5px var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .tq.ans.cur{color:#fff}
  .pts-pill{display:inline-block;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:11.5px;padding:3px 10px;border-radius:999px}
  .mso-saved{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);color:var(--accent);border-radius:12px;padding:9px 16px;font-weight:700;font-size:13px}
  .mso-navrow{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px}
  .mso-finish{margin-left:0;border-color:var(--line);color:var(--muted);font-size:13px;padding:9px 18px}
  .mso-finish:hover{border-color:var(--coral);color:var(--coral);background:var(--coral-soft)}
  /* модалка подтверждения */
  .mso-overlay{position:absolute;inset:0;background:rgba(16,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:20;border-radius:14px}
  .mso-modal{background:var(--surface);border-radius:22px;padding:30px 34px;max-width:520px;text-align:center;box-shadow:0 24px 60px rgba(16,24,40,.35)}
  .mso-modal .btns{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}

  /* ===== Development-phase switcher (Фаза 1 / Фаза 2 / Финал) ===== */
  .phase-switch{display:flex;align-items:center;gap:8px}
  .phase-switch .ps-lbl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .phase-seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .phase-seg button{font-family:inherit;cursor:pointer;border:none;background:none;padding:6px 13px;border-radius:999px;font-weight:700;font-size:12px;color:var(--muted);white-space:nowrap}
  .phase-seg button.on{background:var(--accent);color:#fff;box-shadow:0 1px 4px rgba(112,77,255,.3)}
  /* Phase gating (see teacher prototype for the same rules) */
  body[data-phase="1"] [data-phase="2"],
  body[data-phase="1"] [data-phase="3"],
  body[data-phase="2"] [data-phase="3"]{display:none !important}
  body[data-phase="2"] [data-phase-max="1"],
  body[data-phase="3"] [data-phase-max="1"],
  body[data-phase="3"] [data-phase-max="2"]{display:none !important}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span class="mark"><svg viewBox="0 0 80 92" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 2 H72 V64 H48 L40 88 L32 64 H8 Z" fill="#704DFF"></path><text x="40" y="34" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-weight="700" font-size="44" fill="#fff">A</text></svg></span><span>AI Math · <span id="hdrRole"></span></span></div>
    <div class="hdr-ctx">
      <span class="chip" id="hdrChip"></span>
      <span class="lesson" id="hdrLesson"></span>
      <span id="hdrDate"></span>
    </div>
    <div class="hdr-right">
      <div class="phase-switch">
        <span class="ps-lbl" id="hdrLangLbl"></span>
        <div class="phase-seg" id="langSeg">
          <button data-lg="az" onclick="setLang('az')">AZ</button>
          <button data-lg="en" onclick="setLang('en')">EN</button>
          <button data-lg="ru" onclick="setLang('ru')">RU</button>
        </div>
      </div>
      <div class="phase-switch">
        <span class="ps-lbl" id="hdrStageLbl"></span>
        <div class="phase-seg">
          <button data-pl="1" onclick="setPhaseLvl(1)" id="plBtn1"></button>
          <button data-pl="2" onclick="setPhaseLvl(2)" id="plBtn2"></button>
          <button data-pl="3" class="on" onclick="setPhaseLvl(3)" id="plBtn3"></button>
        </div>
      </div>
      <div class="avatar" id="hdrAvatar"></div>
    </div>
  </header>

  <aside id="nav"></aside>

  <main>
    <div class="demo-bar" id="demoBar"></div>
    <div class="stage">
      <!-- ============ TABLET ============ -->
      <div class="tablet" id="devTablet">
        <div class="cam"></div>
        <div class="tscreen" id="tscreen"></div>
      </div>
      <!-- ============ PHONE ============ -->
      <div class="phone" id="devPhone" style="display:none">
        <div class="notch"></div>
        <div class="pscreen" id="pscreen"></div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= screens registry ================= */
const SCREENS=[
 {id:"s1", grp:"inclass", ic:"⌂", dev:"tablet", phase:1},
 {id:"s1b", ic:"▶", dev:"tablet", phase:1},
 {id:"s2", ic:"⚡", dev:"tablet", phase:1},
 {id:"s3", ic:"▶", dev:"tablet", phase:1},
 {id:"s4", ic:"✎", dev:"tablet", phase:1},
 {id:"s5", ic:"📷", dev:"tablet", phase:1},
 {id:"s6", ic:"✋", dev:"tablet", phase:1},
 {id:"s7", ic:"☺", dev:"tablet", phase:1},
 {id:"s8", ic:"★", dev:"tablet", phase:1},
 {id:"m1", grp:"mso", ic:"📝", dev:"tablet", phase:2},
 {id:"m2", ic:"✎", dev:"tablet", phase:2},
 {id:"m3", ic:"🏁", dev:"tablet", phase:2},
 {id:"s15", grp:"homeTablet", ic:"✎", dev:"tablet", phase:1},
 {id:"s16", ic:"✓", dev:"tablet", phase:1},
 {id:"s17", ic:"⚑", dev:"tablet", phase:1},
 {id:"s18", ic:"👁", dev:"tablet", phase:1},
 {id:"s9", grp:"homePhone", ic:"⌂", dev:"phone", phase:1},
 {id:"s10", ic:"✎", dev:"phone", phase:1},
 {id:"s11", ic:"✓", dev:"phone", phase:1},
 {id:"s12", ic:"⚑", dev:"phone", phase:1},
 {id:"s13", grp:"soon", ic:"♺", dev:"tablet", stub:true, phase:2},
 {id:"s14", ic:"◎", dev:"tablet", stub:true, phase:2},
];
let phaseLvl=3;
let cur="s1";
let lang="az";   // язык по умолчанию — азербайджанский
let L, U;        // L = LOCALE[lang] (весь текст), U — алиас для L (сокращение)

/* ================= nav ================= */
function buildNav(){
  const el=document.getElementById("nav");
  el.innerHTML=SCREENS.map(s=>{
    const ph=s.phase>1?` data-phase="${s.phase}"`:"";
    return (s.grp?`<div class="nav-group"${ph}>${L.navGroup[s.grp]}</div>`:"")+
    `<button class="nav-item${s.id===cur?" on":""}"${ph} data-s="${s.id}" onclick="go('${s.id}')"><span class="ic">${s.ic}</span><span>${L.nav[s.id]}</span>${s.stub?`<span class="nav-soon">${L.stub}</span>`:""}</button>`;
  }).join("")+
  `<div class="nav-spacer"></div><div class="nav-foot">${L.navFoot}</div>`;
}
function go(id){
  cur=id;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("on",b.dataset.s===id));
  const scr=SCREENS.find(s=>s.id===id);
  document.getElementById("devTablet").style.display=scr.dev==="tablet"?"":"none";
  document.getElementById("devPhone").style.display=scr.dev==="phone"?"":"none";
  render();
}
/* ---------- Development-phase switcher (Фаза 1 / Фаза 2 / Финал) ---------- */
function setPhaseLvl(n){
  phaseLvl=n;
  document.body.dataset.phase=n;
  document.querySelectorAll(".phase-seg button[data-pl]").forEach(b=>b.classList.toggle("on",+b.dataset.pl===n));
  // если текущий экран ещё не существует в этой фазе — уводим на первый доступный
  const scr=SCREENS.find(s=>s.id===cur);
  if(scr && (scr.phase||1)>n){ go(SCREENS.find(s=>(s.phase||1)<=n).id); return; }
  render();
}

/* ---------- Language switcher (Azərbaycan / English / Русский) ---------- */
function setLang(code){
  lang=code; L=LOCALE[code]; U=L;
  document.documentElement.lang=L.html;
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on",b.dataset.lg===code));
  rebuildData();     // пересобрать контент (задачи, слайды и т.п.) на новом языке
  applyChrome();     // шапка, лейблы переключателей
  buildNav();        // навигация
  render();          // текущий экран + демо-бар
}

/* заполняем статичную «обвязку» (шапку и лейблы) текущим языком */
function applyChrome(){
  document.getElementById("hdrRole").textContent=L.role;
  document.getElementById("hdrChip").textContent=L.chip;
  document.getElementById("hdrLesson").textContent=L.lessonHdr;
  document.getElementById("hdrDate").textContent=L.dateHdr;
  document.getElementById("hdrAvatar").textContent=L.avatarInit;
  document.getElementById("hdrLangLbl").textContent=L.langLabel;
  document.getElementById("hdrStageLbl").textContent=L.stageLabel;
  document.getElementById("plBtn1").textContent=L.ph1;
  document.getElementById("plBtn2").textContent=L.ph2;
  document.getElementById("plBtn3").textContent=L.ph3;
}

/* scale a screen's content so it fully fits inside the device frame — no inner scroll */
function fitContent(){
  const scr=SCREENS.find(s=>s.id===cur);
  const host=document.getElementById(scr.dev==="tablet"?"tscreen":"pscreen");
  const fc=host.firstElementChild; if(!fc)return;
  const sw=host.clientWidth, sh=host.clientHeight;
  fc.style.transformOrigin="top left";
  fc.style.transform="none"; fc.style.width=sw+"px";
  if(fc.scrollHeight<=sh){fc.style.width="";return;}
  // widen the wrapper so that, once scaled to fit the height, it still fills the frame width
  let sc=sh/fc.scrollHeight;
  for(let i=0;i<4;i++){
    fc.style.width=(sw/sc)+"px";
    const rendered=fc.scrollHeight*sc;
    if(rendered<=sh+0.5)break;
    sc*=sh/rendered;
  }
  fc.style.transform=`scale(${sc})`;
}

/* fit the visible device into the available stage area — no page scroll, no clipping */
function fitStage(){
  const scr=SCREENS.find(s=>s.id===cur);
  const dev=document.getElementById(scr.dev==="tablet"?"devTablet":"devPhone");
  const stage=dev.parentNode;
  dev.style.transform="none";
  const dh=dev.offsetHeight, dw=dev.offsetWidth;
  const sh=stage.clientHeight, sw=stage.clientWidth;
  if(!dh||!sh)return;
  const sc=Math.min(1, sh/dh, sw/dw);
  dev.style.transformOrigin="top center";
  dev.style.transform=`scale(${sc})`;
}
function fitAll(){fitContent();fitStage();}
window.addEventListener("resize",fitAll);
window.addEventListener("load",()=>requestAnimationFrame(fitAll));
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2400);}

/* ================= demo bar (teacher-signal simulation) ================= */
const DEMO={
 s1:[{lk:"s1_start",f:()=>{toast(L.toast.signalStart);go('s1b')}}],
 s1b:[{lk:"s1b_warm",f:()=>go('s2')}],
 s2:[{lk:"s2_reveal",f:()=>{if(st.ansState==null){toast(L.toast.pickFirst);return;}st.wReveal=true;render()}},{lk:"s2_explain",f:()=>go('s3')}],
 s3:[
   {lk:"s3_slide",f:()=>{st.slide=(st.slide+1)%3;render()}},
   {lk:"s3_open",f:()=>{const n=st.exTask==null?0:st.exTask+1;if(n>=EXTASK.length){toast(L.toast.allTasksOpen);return;}st.exTask=n;st.exAns=null;st.exReveal=false;render()}},
   {lk:"s3_reveal",f:()=>{if(st.exTask==null){toast(L.toast.teacherNotOpen);return;}if(st.exAns==null){toast(L.toast.pickAnswer);return;}st.exReveal=true;render()}},
   {lk:"s3_practice",f:()=>go('s4')}
 ],
 s4:[{lk:"s4_reflect",f:()=>go('s7')}],
 s5:[],
 s6:[{lk:"s6_help",f:()=>{toast(L.toast.teacherHelped);st.stuck=false;go('s4')}}],
 s7:[{lk:"s7_finish",f:()=>go('s8')}],
 s8:[{lk:"s8_evening",f:()=>go('s9')}],
 s9:[],s10:[],s11:[],s12:[],s13:[],s14:[],
 s15:[],s16:[],s17:[],s18:[],
 m1:[{lk:"m1_start",f:()=>{toast(L.toast.msoStarted);go('m2')}}],
 m2:[
   {lk:"m2_fill",f:()=>{msoAutofill();toast(L.toast.msoFilled);render()}},
   {lk:"m2_5min",f:()=>{st.msoLast5=true;toast(L.toast.msoTimer);render()}},
   {lk:"m2_finish",f:()=>{toast(L.toast.msoTimeUp);msoFinish('teacher')}},
 ],
 m3:[],
};
function demoBar(){
  const list=DEMO[cur]||[];
  const note=(L.note||{})[cur]||"";
  document.getElementById("demoBar").innerHTML=
    `<span class="lbl">${L.demoLabel}</span>`+
    list.map((d,i)=>`<button class="demo-btn" onclick="DEMO['${cur}'][${i}].f()">${L.demo[d.lk]}</button>`).join("")+
    `<button class="demo-btn ghost" onclick="resetAll()">${L.demoReset}</button>`+
    (note?`<span class="demo-note">${note}</span>`:"");
}

/* ================= demo state ================= */
const initState=()=>({
  wq:0, wdone:[], wReveal:false, // warm-up: index + results; разбор открывается по сигналу учителя
  slide:0,
  exTask:null, exAns:null, exReveal:false,
  prac:0, pracOk:0, ansState:null, stuck:false, wrongTries:0, queuePos:2, deferred:[],
  camStep:0, photos:[],
  refl:null, reflStep:"emoji", reflCrit:{}, reflSent:false,
  hq:0, hdone:[], hwFinished:false,
  reviewLesson:null,

/* ================= mock data =================
   Логика (правильные ответы, распределения, баллы, структура заданий) —
   ЯЗЫКОНЕЗАВИСИМА и живёт в LOGIC. Текст (условия, варианты, подписи) — в
   LOCALE[lang]. rebuildData() склеивает их в рабочие массивы при смене языка. */
const LOGIC={
  warmup:[{ok:0,dist:[19,4,5,2]},{ok:1,dist:[3,21,4,2]},{ok:2,dist:[4,2,20,4]}],
  extask:[{ok:0,dist:[18,5,7]},{ok:1,dist:[6,24]}],
  practice:[{type:"input",fields:[{a:4},{a:2}]},{type:"input",fields:[{a:4},{a:3}]},{type:"written"}],
  homework:[{ok:0},{ok:0},{ok:1},{ok:0},{ok:1},{ok:0}],
  mso:[{type:"choice",ok:0,pts:1},{type:"choice",ok:1,pts:1},{type:"input",fields:[{a:8},{a:3}],pts:2},{type:"input",fields:[{a:5}],pts:2},{type:"written",pts:3}],
  topics:[{stars:3},{stars:2},{stars:3},{missed:true},{cur:true},{locked:true},{locked:true}],
  // Как ученик прошёл урок — для режима просмотра (мок; один набор на все уроки)
  review:{warmup:[0,1,0],practice:[{vals:["4","2"],ok:true},{vals:["4","3"],ok:true},{written:true}],reflEmoji:2,reflCrit:[1,1,0],homework:[0,0,1,0,1,1]},
};
// Рабочие массивы контента — пересобираются в rebuildData() под текущий язык
let WARMUP,SLIDES,EXTASK,PRACTICE,HOMEWORK,MSO,FEEDBACK,REFLCRIT,CRITLEVELS,TOPICS,REVIEW,REFLEMOJIS;
const starsFor=(ok,total)=>{const r=ok/total;return r>=0.8?3:r>=0.5?2:1;};
const starsHTML=(n,big)=>`<span class="${big?"big-stars":"hw-stars"}">${"★".repeat(n)}<span class="dim">${"★".repeat(3-n)}</span></span>`;
function rebuildData(){
  const c=L;
  WARMUP=LOGIC.warmup.map((o,i)=>({...o,q:c.warmup[i].q,opts:c.warmup[i].opts}));
  SLIDES=c.slides;
  EXTASK=LOGIC.extask.map((o,i)=>({...o,q:c.extask[i].q,opts:c.extask[i].opts}));
  PRACTICE=LOGIC.practice.map((o,i)=>({...o,text:c.practice[i].text,fields:(o.fields||[]).map((f,j)=>({...f,l:c.practice[i].fields[j].l}))}));
  HOMEWORK=LOGIC.homework.map((o,i)=>({...o,q:c.homework[i].q,opts:c.homework[i].opts}));
  MSO=LOGIC.mso.map((o,i)=>{const t=c.mso[i];const m={...o,q:t.q};if(t.opts)m.opts=t.opts;if(o.fields)m.fields=o.fields.map((f,j)=>({...f,l:t.fields[j].l}));if(t.crit)m.crit=t.crit;return m;});
  FEEDBACK=c.feedback; REFLCRIT=c.reflcrit; CRITLEVELS=c.critlevels; REFLEMOJIS=c.reflemojis;
  TOPICS=LOGIC.topics.map((o,i)=>({...o,nm:c.topics[i].nm,why:c.topics[i].why}));
  REVIEW=LOGIC.review;
}

/* ----- S2 warm-up ----- */
function s2(){
  const i=st.wq, done=i>=WARMUP.length;
  const dots=WARMUP.map((_,k)=>`<span class="q-dot ${k===i?"cur":st.wdone[k]===true?"ok":st.wdone[k]===false?"bad":""}"></span>`).join("");
  if(done){
    const ok=st.wdone.filter(Boolean).length;
    return `<div class="t-pad">${tabletTop(L.phWarm)}${phasebar(1)}
      <div class="bigcard center" style="margin-top:60px;gap:10px;max-width:640px;margin-left:auto;margin-right:auto">

        <div class="pulse" style="margin-top:8px"><span class="dot"></span> ${L.waitExplain}</div>
      </div></div>`;
  }
  const w=WARMUP[i], a=st.ansState, rev=st.wReveal;
  // верный/неверный показываем только после сигнала учителя (rev), не сразу после ответа
  return `<div class="t-pad">${tabletTop(L.phWarm)}${phasebar(1)}
    <div class="q-progress">${dots}</div>
    <div class="question">${w.q}</div>
    <div class="opts">${w.opts.map((o,k)=>{
      let cls="opt";
      if(a!==null&&a!==undefined){
        if(rev){ if(k===a) cls+=a===w.ok?" sel-ok":" sel-bad"; if(k===w.ok&&a!==w.ok) cls+=" show-ok"; }
        else if(k===a) cls+=" sel";
      }
      return `<button class="${cls}" ${a!=null?"disabled":""} onclick="wAnswer(${k})">${o}</button>`;
    }).join("")}</div>
    ${rev?distHTML(w):""}
    <div class="feedback">${a!=null?(rev
      ?(a===w.ok
        ?`<span class="fb ok">${L.fbCorrectWarm}</span>`
        :`<span class="fb bad">${L.fbWrongReveal}</span>`)
      :`<span class="pulse"><span class="dot"></span> ${L.answerSentWait}</span>`)
      :`<span class="sub">${L.pickHint}</span>`}
      ${a!=null&&rev?`<div style="margin-top:14px"><button class="btn primary" onclick="wNext()">${L.btnNext}</button></div>`:""}
    </div></div>`;
}
function wAnswer(k){if(st.ansState!=null)return;st.ansState=k;st.wdone[st.wq]=(k===WARMUP[st.wq].ok);render();}
function wNext(){st.wq++;st.ansState=null;st.wReveal=false;render();}
/* class result on the student tablet (warm-up + explanation tasks): correct vs wrong, not per option */
function distHTML(q){
  const total=q.dist.reduce((s,n)=>s+n,0), ok=q.dist[q.ok], bad=total-ok, pct=Math.round(ok/total*100);
  return `<div class="wdist"><div class="wdist-cap">${L.distCap}</div>
    <div class="wdist-main"><span class="wdist-track"><i style="width:${pct}%"></i></span><span class="wdist-pct">${pct}%</span></div>
    <div class="wdist-counts">${L.distCorrect} <b class="okn">${ok}</b><span class="gap"></span>${L.distWrong} <b class="badn">${bad}</b></div>
  </div>`;
}

  const i=st.prac;
  if(i>=PRACTICE.length){
    return `<div class="t-pad">${tabletTop(L.phPractice)}${phasebar(3)}

  const deferPills=st.deferred.length
    ? `<span class="defer-hint">${L.returnBack} ${st.deferred.map(d=>`<button class="defer-pill" onclick="returnTo(${d})">${L.taskChip(d+1)}</button>`).join("")}</span>`

  const helpBtn=st.wrongTries>=2
    ?`<button class="btn ghost help-link" onclick="st.stuck=true;render()">${L.callTeacher}</button>`:"";
  if(t.type==="written"){
    return `<div class="t-pad">${tabletTop(L.phPractice)}${phasebar(3)}${head}
      <div class="task-card">
        <div class="task-num">${L.taskWritten(i+1)}</div>
        <div class="task-text">${t.text}</div>
        <div class="written-banner"><span class="ic">📓</span> ${L.writtenBanner}</div>
        <div class="task-foot">
          <button class="btn primary" onclick="st.camStep=0;go('s5')">${L.photoBtn}</button>
          <button class="btn ghost help-link" onclick="st.stuck=true;render()">${L.callTeacher}</button>
        </div>
      </div></div>`;
  }
  const a=st.ansState; // null | "ok" | "bad"
  return `<div class="t-pad">${tabletTop(L.phPractice)}${phasebar(3)}${head}
    <div class="task-card">
      <div class="task-num">${L.taskNum(i+1)}</div>
      <div class="task-text">${t.text}</div>
      <div class="answer-row">
        ${t.fields.map((f,k)=>`<div class="ans-field"><label>${f.l}</label><input id="pf${k}" inputmode="numeric" maxlength="3" class="${a==="ok"?"ok":a==="bad"?"bad":""}" ${a==="ok"?"disabled":""}></div>`).join("")}
        ${a==="ok"
          ?`<button class="btn primary" onclick="pNext()">${L.btnNext}</button>`
          :`<button class="btn primary" onclick="pCheck()">${L.btnCheck}</button>`}
        ${helpBtn}
      </div>
      <div class="feedback" style="text-align:left;min-height:40px;margin-top:14px">
        ${a==="ok"?`<span class="fb ok">${L.fbCorrectKeep}</span>`:a==="bad"?`<span class="fb bad">${L.fbWrongPractice}</span>`:""}
      </div>
    </div></div>`;
}
function pCheck(){
  const t=PRACTICE[st.prac];
  const ok=t.fields.every((f,k)=>{const v=document.getElementById("pf"+k).value.trim();return v!==""&&+v===f.a;});
  if(ok&&st.ansState!=="ok")st.pracOk++;
  if(!ok)st.wrongTries++;
  st.ansState=ok?"ok":"bad";
  const vals=t.fields.map((_,k)=>document.getElementById("pf"+k).value);
  render();
  t.fields.forEach((_,k)=>{const el=document.getElementById("pf"+k);if(el)el.value=vals[k];});
}
function pNext(){st.prac++;st.ansState=null;st.wrongTries=0;render();}

/* ----- S7 reflection -----
   Последовательность: смайлики (эмоц. оценка урока) → самооценка по критериям (Ф2+) → готово.
   Ф1: только смайлики. Ф2+: после смайликов — самооценка по каждому критерию плана урока. */
function s7(){
  const needCrit=phaseLvl>=2;
  // ----- готово: подтверждение -----
  if(st.reflSent){
    const sentNote=needCrit?L.reflSentCrit:L.reflSentEmoji;
    return `<div class="t-pad">${tabletTop(L.phReflect)}${phasebar(4)}
      <div class="bigcard center" style="margin-top:60px;gap:10px;max-width:620px;margin-left:auto;margin-right:auto">
        <div style="font-size:52px">${REFLEMOJIS[st.refl][0]}</div>
        <h2 class="kid">${L.reflThanks}</h2>
        <div class="sub">${sentNote}</div>
        <div class="pulse" style="margin-top:8px"><span class="dot"></span> ${L.reflTeacherFinish}</div>
      </div></div>`;
  }
  // ----- шаг 2: самооценка по критериям (Ф2+) -----
  if(st.reflStep==="crit"){
    const allRated=REFLCRIT.every((_,i)=>st.reflCrit[i]!=null);
    return `<div class="t-pad">${tabletTop(L.phReflect)}${phasebar(4)}
      <div class="center" style="margin-top:8px">
        <h1 class="kid" style="font-size:24px">${L.reflCritTitle}</h1>
        <div class="sub" style="margin-top:8px">${L.reflCritSub}</div>
      </div>
      <div class="crit-list">${REFLCRIT.map((c,i)=>`
        <div class="crit-item">
          <div class="crit-q"><span class="n">${i+1}</span>${c}</div>
          <div class="crit-opts">${CRITLEVELS.map((lv,l)=>`
            <button class="crit-opt l${l} ${st.reflCrit[i]===l?"sel":""}" onclick="reflPickCrit(${i},${l})">
              <span class="ce">${lv[0]}</span><span>${lv[1]}</span>
            </button>`).join("")}</div>
        </div>`).join("")}</div>
      <div class="center" style="margin-top:18px">
        <button class="btn primary big" ${allRated?"":"disabled"} onclick="st.reflSent=true;render()">${L.btnSend}</button>
      </div></div>`;
  }
  // ----- шаг 1: эмоциональная оценка урока (смайлики) -----
  const next=needCrit?`st.reflStep='crit'`:`st.reflSent=true`;
  return `<div class="t-pad">${tabletTop(L.phReflect)}${phasebar(4)}

/* ================= МСО · контрольная работа (планшет) =================
   Отличия от обычного урока: один этап (сама контрольная), задания решаются
   в любом порядке, ответы можно менять, верно/неверно не показываем — ни в
   процессе, ни после. Ответы фиксируются при завершении: сам ребёнок
   («Завершить» в правом верхнем углу + подтверждение) или учитель
   (авто-фиксация, «время вышло»). Балл ребёнку не показываем: письменные
   задания проверяются позже — результаты сообщит учитель на следующем уроке.
   Таймер ребёнку показываем только в последние 5 минут. */

const msoAnswered=(i)=>{
  const t=MSO[i], a=st.msoAns[i];
  if(!a) return false;
  if(t.type==="choice") return a.k!=null;
  if(t.type==="input") return t.fields.every((_,j)=>a.vals&&a.vals[j]!=null&&String(a.vals[j]).trim()!=="");
  return !!a.photo;
};
const msoAnsCount=()=>MSO.reduce((n,_,i)=>n+(msoAnswered(i)?1:0),0);
const msoTimer=()=>st.msoLast5?`<span class="mso-timer"><span class="dot"></span>${L.msoTimer}</span>`:"";
const msoHead=()=>`<div class="mso-head">
   <span class="pill accent">${L.msoPill}</span>
   <span class="mso-count">${L.msoAnsC(msoAnsCount(),MSO.length)}</span>
   <span style="margin-left:auto"></span>${msoTimer()}
   <button class="btn ghost mso-finish" onclick="st.msoConfirm=true;render()">${L.finishBtn}</button>
 </div>`;

/* ----- M1 ожидание старта ----- */
function m1(){
  return `<div class="t-pad">${tabletTop("")}
    <div class="bigcard center" style="margin-top:70px;gap:12px;max-width:680px;margin-left:auto;margin-right:auto">

}

/* ----- M2 задание теста ----- */
function m2(){
  if(st.msoDone) return m3();
  const i=st.msoTask, t=MSO[i], a=st.msoAns[i]||{};
  const chips=MSO.map((_,k)=>`<button class="tq ${msoAnswered(k)?"ans":""} ${k===i?"cur":""}" onclick="msoGoto(${k})">${k+1}</button>`).join("");
  let body="";
  if(t.type==="choice"){
    body=`<div class="question" style="margin:10px 0 20px">${t.q}</div>
      <div class="opts">${t.opts.map((o,k)=>`<button class="opt ${a.k===k?"sel":""}" onclick="msoPick(${k})">${o}</button>`).join("")}</div>`;
  }else if(t.type==="input"){
    body=`<div class="task-card">
      <div class="task-text">${t.q}</div>
      <div class="answer-row">${t.fields.map((f,k)=>`<div class="ans-field"><label>${f.l}</label><input id="mf${k}" inputmode="numeric" maxlength="3" value="${a.vals&&a.vals[k]!=null?a.vals[k]:""}" oninput="msoVal(${i},${k},this.value)"></div>`).join("")}</div>
    </div>`;
  }else{
    body=`<div class="task-card">
      <div class="task-text">${t.q}</div>
      <div class="written-banner"><span class="ic">📓</span> ${L.msoWrittenBanner}</div>
      <div class="task-foot">${a.photo
        ?`<span class="mso-saved">${L.photoAttached}</span><button class="btn ghost" onclick="st.msoAns[${i}]={photo:true};st.camStep=0;toast(L.toast.cameraLikePractice);render()">${L.retake}</button>`
        :`<button class="btn primary" onclick="st.msoAns[${i}]={photo:true};render()">${L.photoBtn}</button>`}</div>
    </div>`;
  }
  // подтверждение завершения — по кнопке «Завершить» в правом верхнем углу
  const empty=MSO.map((_,k)=>k).filter(k=>!msoAnswered(k));
  const modal=!st.msoConfirm?"":`<div class="mso-overlay" onclick="st.msoConfirm=false;render()">
    <div class="mso-modal" onclick="event.stopPropagation()">
      <div style="font-size:44px;margin-bottom:8px">${empty.length?"🤔":"🏁"}</div>
      ${empty.length
        ?`<h2 class="kid">${L.msoEmptyTitle(empty.length)}</h2>
           <div class="sub" style="margin-top:8px">${L.msoSureFinish}</div>
           <div class="btns">
             <button class="btn primary" onclick="st.msoConfirm=false;msoGoto(${empty[0]})">${L.msoBackToTest}</button>
             <button class="btn ghost" onclick="msoFinish('self')">${L.finishBtn}</button>
           </div>`
        :`<h2 class="kid">${L.msoSureFinish}</h2>
           <div class="sub" style="margin-top:8px">${L.msoNoChange}</div>
           <div class="btns">
             <button class="btn ghost" onclick="st.msoConfirm=false;render()">${L.msoBackToTest}</button>
             <button class="btn primary" onclick="msoFinish('self')">${L.finishBtn}</button>
           </div>`}
    </div></div>`;
  return `<div class="t-pad" style="position:relative;min-height:640px">${tabletTop(L.phTest)}${msoHead()}
    <div class="tq-row">${chips}</div>
    <div class="center" style="margin-bottom:10px"><span class="pts-pill">${L.ptsPill(t.pts,t.type==="written")}</span></div>
    ${body}
    <div class="feedback" style="min-height:44px;margin-top:12px">${msoAnswered(i)
      ?`<span class="mso-saved">${L.msoAnsRecorded}</span>`
      :`<span class="sub">${L.msoWaitCheck}</span>`}</div>
    <div class="mso-navrow">
      <button class="btn ghost" ${i===0?"disabled style='opacity:.4'":""} onclick="msoGoto(${i-1})">${L.btnBack}</button>
      ${i<MSO.length-1?`<button class="btn primary" onclick="msoGoto(${i+1})">${L.btnNext}</button>`:""}
    </div>
    ${modal}</div>`;
}
function msoGoto(k){if(k<0||k>=MSO.length)return;st.msoTask=k;go('m2');}
function msoPick(k){st.msoAns[st.msoTask]={k};render();}
function msoVal(i,k,v){const a=st.msoAns[i]||(st.msoAns[i]={});(a.vals||(a.vals=[]))[k]=v;}
function msoFinish(by){st.msoDone=true;st.msoEndBy=by;st.msoConfirm=false;go('m3');}
function msoAutofill(){st.msoAns={0:{k:0},1:{k:2},2:{vals:["8","3"]},3:{vals:["5"]},4:{photo:true}};}

  const dots=HOMEWORK.map((_,k)=>`<span class="q-dot ${k===i?"cur":st.hdone[k]===true?"ok":st.hdone[k]===false?"bad":""}"></span>`).join("");
  return `<div class="t-pad">${tabletTop("")}
    <div class="prac-top">
      <span class="pill accent">${L.hwPill}</span>
      <span class="prac-prog">${L.hwProg(i+1,HOMEWORK.length)}</span>
    </div>
    <div class="q-progress">${dots}</div>
    <div class="question">${h.q}</div>
    <div class="opts">${h.opts.map((o,k)=>{
      let cls="opt";
      if(a!=null){
        if(phaseLvl>=2){ if(k===a) cls+=a===h.ok?" sel-ok":" sel-bad"; if(k===h.ok&&a!==h.ok) cls+=" show-ok"; }
        else if(k===a) cls+=" sel";
      }
      return `<button class="${cls}" ${a!=null?"disabled":""} onclick="hAnswer(${k})">${o}</button>`;
    }).join("")}</div>
    <div class="feedback">${a!=null?(phaseLvl>=2
      ?(a===h.ok?`<span class="fb ok">${L.fbCorrectShort}</span>`:`<span class="fb bad">${L.fbRightHighlighted}</span>`)
      :`<span class="fb ok" style="background:var(--accent-soft);color:var(--accent)">${L.answerSavedTeacher}</span>`)
      :`<span class="sub">${L.canPause}</span>`}
      ${a!=null?`<div style="margin-top:14px"><button class="btn primary" onclick="hNext()">${i===HOMEWORK.length-1?L.finishWord:L.nextWord} →</button></div>`:""}

}

/* ----- S18 lesson review (read-only «режим просмотра») -----
   Вход: тап по пройденному уроку в «Мой прогресс» (S17). Показывает, как ученик
   прошёл и классную, и домашнюю работу. Ф1 — разминка + практика; Ф2 — полный
   повтор всех фаз (добавляются объяснение и рефлексия). Только просмотр. */
function openReview(name){st.reviewLesson=name;go('s18');}
function s18(){
  const lesson=st.reviewLesson||L.feedback.topic;
  const full=phaseLvl>=2;
  const icOk=v=>v===true?'<span class="ic" style="color:var(--green)">✓</span>'
    :v===false?'<span class="ic" style="color:var(--coral)">✗</span>'
    :'<span class="ic" style="color:var(--muted)">•</span>';
  const revRow=(v,q,a)=>`<div class="rev-row">${icOk(v)}<div class="rev-d"><div class="rev-q">${q}</div><div class="rev-a">${a}</div></div></div>`;

  // ----- Классная работа -----
  const wuOk=WARMUP.filter((w,k)=>REVIEW.warmup[k]===w.ok).length;
  const warmup=WARMUP.map((w,k)=>{
    const pick=REVIEW.warmup[k], ok=pick===w.ok;
    return revRow(ok, w.q, `${L.yourAnswer} <b class="${ok?'ok-ans':'bad-ans'}">${w.opts[pick]}</b>${ok?'':` · ${L.revCorrect}: <b class="ok-ans">${w.opts[w.ok]}</b>`}`);
  }).join("");
  const practice=PRACTICE.map((t,k)=>{
    const r=REVIEW.practice[k];
    if(r.written) return revRow(null, L.taskWritten(k+1), L.writtenSolvedVal);
    const vals=t.fields.map((f,i)=>`${f.l}: <b class="${r.ok?'ok-ans':'bad-ans'}">${r.vals[i]}</b>`).join(" · ");
    return revRow(r.ok, L.taskNum(k+1), vals);
  }).join("");
  // Ф2-only: объяснение и рефлексия
  const explain=full?`<div class="rev-sec"><div class="rev-sec-h">${L.explainH}</div>
    ${SLIDES.map((s,k)=>revRow(null, L.slideK(k+1), s.t)).join("")}</div>`:"";
  const refl=full?`<div class="rev-sec"><div class="rev-sec-h">${L.reflH}</div>
    ${revRow(null, L.howLesson, `<b>${REFLEMOJIS[REVIEW.reflEmoji][0]} ${REFLEMOJIS[REVIEW.reflEmoji][1]}</b>`)}
    ${REFLCRIT.map((c,i)=>revRow(null, c, `<b>${CRITLEVELS[REVIEW.reflCrit[i]][0]} ${CRITLEVELS[REVIEW.reflCrit[i]][1]}</b>`)).join("")}</div>`:"";

  // ----- Домашняя работа -----
  const hwOk=HOMEWORK.filter((h,k)=>REVIEW.homework[k]===h.ok).length;
  const homework=HOMEWORK.map((h,k)=>{
    const pick=REVIEW.homework[k], ok=pick===h.ok;
    return revRow(ok, h.q, `${L.yourAnswer} <b class="${ok?'ok-ans':'bad-ans'}">${h.opts[pick]}</b>${ok?'':` · ${L.revCorrect}: <b class="ok-ans">${h.opts[h.ok]}</b>`}`);
  }).join("");

  return `<div class="t-pad">${tabletTop("")}
    <div class="prac-top">
      <button class="btn ghost" style="padding:8px 14px" onclick="go('s17')">${L.btnBack}</button>
      <span class="pill" style="background:var(--surface-2)">${L.reviewMode}</span>
      <span class="prac-prog">${L.reviewProg}</span>
    </div>
    <h2 class="kid" style="margin:6px 0 10px">${lesson}</h2>
    <div class="rev-wrap">
      <div>
        <div class="hb-label">${L.classworkH}</div>
        <div class="bigcard" style="padding:14px 20px">
          <div class="rev-sec"><div class="rev-sec-h">${L.warmupH(wuOk,WARMUP.length)}</div>${warmup}</div>
          ${explain}
          <div class="rev-sec"><div class="rev-sec-h">${L.practiceH}</div>${practice}</div>
          ${refl}
        </div>
      </div>
      <div>
        <div class="hb-label">${L.homeworkRevH(hwOk,HOMEWORK.length)}</div>
        <div class="bigcard" style="padding:14px 20px">${homework}</div>
      </div>
    </div></div>`;
}

/* ----- S10 homework ----- */
function s10(){
  const i=st.hq;
  if(i>=HOMEWORK.length){st.hwFinished=true;return s11();}
  const h=HOMEWORK[i], a=st.ansState;
  const dots=HOMEWORK.map((_,k)=>`<span class="hw-dot ${k===i?"cur":st.hdone[k]===true?"ok":st.hdone[k]===false?"bad":""}"></span>`).join("");

    <div class="p-q">${h.q}</div>
    <div class="p-opts">${h.opts.map((o,k)=>{
      let cls="p-opt";
      if(a!=null){
        if(phaseLvl>=2){ if(k===a) cls+=a===h.ok?" sel-ok":" sel-bad"; if(k===h.ok&&a!==h.ok) cls+=" show-ok"; }
        else if(k===a) cls+=" sel";
      }
      return `<button class="${cls}" ${a!=null?"disabled":""} onclick="hAnswer(${k})">${o}</button>`;
    }).join("")}</div>

      ?(a===h.ok?`<span class="fb ok">${L.fbCorrectShort}</span>`:`<span class="fb bad">${L.fbRightHighlighted}</span>`)
      :`<span class="sub">${L.answerSavedTeacher}</span>`)
      :`<span class="sub">${L.canPause}</span>`}
      ${a!=null?`<div style="margin-top:12px"><button class="btn primary" style="width:100%" onclick="hNext()">${i===5?L.finishWord:L.nextWord} →</button></div>`:""}
    </div></div>`;
}
function hAnswer(k){if(st.ansState!=null)return;st.ansState=k;st.hdone[st.hq]=(k===HOMEWORK[st.hq].ok);render();}
